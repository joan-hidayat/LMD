<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central SaaS - License Management Dashboard</title>

    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Chart.js CDN for Modern Analytics Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Fonts: Plus Jakarta Sans, Outfit & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/style.css?v=20261031_v3">
</head>

<body>
<div id="app">
    <!-- LOGIN ADMIN LMD (T-04) -->
    <div v-if="auth.checked && !auth.user" class="login-screen">
        <form class="login-card" @submit.prevent="login" novalidate>
            <div class="brand">
                <div class="brand-logo">CS</div>
                <div>
                    <div class="brand-title">Central SaaS</div>
                    <span class="brand-subtitle">License Management</span>
                </div>
            </div>
            <h2>Masuk ke dashboard</h2>
            <p class="login-lead">Khusus admin Central SaaS LMD.</p>
            <div v-if="auth.setupNeeded" class="login-alert">
                Belum ada akun admin. Buat dari command line di server:<br>
                <code>php database/admin.php create &lt;email&gt; "&lt;nama&gt;"</code>
            </div>
            <div v-if="auth.error" class="login-alert error">{{ auth.error }}</div>
            <label for="login-email">Email</label>
            <input id="login-email" v-model="auth.email" type="email" autocomplete="username" required autofocus>
            <label for="login-password">Password</label>
            <input id="login-password" v-model="auth.password" type="password" autocomplete="current-password" required>
            <button type="submit" class="btn btn-primary" :disabled="auth.loading">{{ auth.loading ? 'Memeriksa…' : 'Masuk' }}</button>
            <p class="login-hint">Lupa password? Jalankan <code>php database/admin.php reset-password &lt;email&gt;</code> di server.</p>
        </form>
    </div>

    <template v-if="auth.user">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">CS</div>
            <div>
                <div class="brand-title">Central SaaS</div>
                <span class="brand-subtitle">License Management</span>
            </div>
        </div>
        <nav>
            <div class="menu-title">Main Menu</div>
            <a class="nav-item" :class="{ active: activePage === 'dashboard' }" @click="setActivePage('dashboard')">
                📊 Dashboard
            </a>
            <a class="nav-item" :class="{ active: activePage === 'applications' }" @click="setActivePage('applications')">
                📱 Applications & Modules
            </a>
            <a class="nav-item" :class="{ active: activePage === 'packages' }" @click="setActivePage('packages')">
                📦 Sales Packages
            </a>
            <a class="nav-item" :class="{ active: activePage === 'customers' }" @click="setActivePage('customers')">
                👥 Customers
            </a>
            <a class="nav-item" :class="{ active: activePage === 'subscriptions' }" @click="setActivePage('subscriptions')">
                📜 Subscriptions
            </a>
            <a class="nav-item" :class="{ active: activePage === 'licenses' }" @click="setActivePage('licenses')">
                🔑 Licenses
            </a>
            <a class="nav-item" :class="{ active: activePage === 'guide' }" @click="setActivePage('guide')">
                📚 Buku Panduan
            </a>
            <a class="nav-item" :class="{ active: activePage === 'audit' }" @click="setActivePage('audit')">
                📝 License Audit Logs
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main">
        <header class="topbar">
            <div class="topbar-left">
                <h3 style="font-size: 15px; font-weight: 800; letter-spacing: -0.01em;">Central SaaS License Dashboard</h3>
                <div class="topbar-badge-live">
                    <span class="topbar-pulse-dot"></span>
                    <span>Live Telemetry: <strong>Online</strong></span>
                </div>
            </div>
            <div style="display: flex; gap: 8px;">
                <a href="http://localhost:8080/software-showcase/" target="_blank" class="btn btn-sm" style="background: rgba(99, 102, 241, 0.15); color: #c7d2fe; border: 1px solid rgba(99, 102, 241, 0.35); font-weight: 700; text-decoration: none;">🚀 Portfolio Showcase</a>
                <a href="client_demo/apotek.html" target="_blank" class="btn btn-sm" style="background: rgba(13, 148, 136, 0.2); color: #2dd4bf; border: 1px solid rgba(13, 148, 136, 0.4); font-weight: 700; text-decoration: none;">💊 Demo Client Apotek</a>
                <button class="btn btn-primary btn-sm" @click="openModal('tester')">⚡ Test License API</button>
                <div class="admin-chip" :title="auth.user.email">
                    <span>{{ auth.user.name }}</span>
                    <button type="button" class="btn btn-sm" @click="logout">Keluar</button>
                </div>
            </div>
        </header>

        <main class="content">

            <!-- PAGE 1: DASHBOARD -->
            <div v-if="activePage === 'dashboard'">
                <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
                    <div>
                        <h2 style="font-size: 22px; font-weight: 800;">Executive & Operational Analytics</h2>
                        <p style="color: var(--muted); font-size: 13px;">Dashboard visualisasi pengambil keputusan: radar jatuh tempo, kontribusi revenue, dan adopsi fitur.</p>
                    </div>
                    <button class="btn btn-sm" @click="fetchDashboardData">🔄 Segarkan Data</button>
                </div>

                <!-- PENDING ORDER BANNER (Self-Service Showcase) -->
                <div v-if="pendingOrders.length > 0" class="alert-card order-pending">
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <span style="font-size: 26px;">🧾</span>
                        <div>
                            <div style="font-weight: 800; font-size: 14px;">{{ pendingOrders.length }} pesanan menunggu persetujuan pembayaran</div>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">
                                Customer dari Software Showcase sedang menunggu di layar aktivasi. Cek dana masuk, lalu approve agar lisensi langsung aktif.
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-sm btn-primary" @click="setActivePage('subscriptions')">Proses Pesanan →</button>
                </div>

                <!-- EARLY WARNING ALERT BANNER -->
                <div v-if="analytics.expiring_radar && (analytics.expiring_radar.critical_7d > 0 || analytics.expiring_radar.expired > 0)" class="alert-card critical">
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <span style="font-size: 26px;">⚠️</span>
                        <div>
                            <div style="font-weight: 800; font-size: 14px; color: #991b1b;">Early Warning: Lisensi Perlu Tindak Lanjut Segera!</div>
                            <div style="font-size: 12px; color: #7f1d1d; margin-top: 2px;">
                                Terdeteksi <strong>{{ analytics.expiring_radar.critical_7d }} lisensi kritis (≤ 7 hari)</strong> dan <strong>{{ analytics.expiring_radar.expired }} lisensi kedaluwarsa</strong>. Segera hubungi customer untuk perpanjangan kontrak sebelum akses aplikasi terkunci otomatis di lapangan.
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-sm btn-danger" @click="scrollToAttentionList">Lihat Daftar Perhatian ↓</button>
                </div>

                <!-- STAT KPI CARDS -->
                <div class="stat-grid">
                    <div class="card">
                        <div class="stat-title">Total Applications</div>
                        <div class="stat-value">{{ stats.total_apps }}</div>
                        <small style="color: var(--muted); font-size: 11px;">Katalog sistem SaaS</small>
                    </div>
                    <div class="card">
                        <div class="stat-title">Active Subscriptions</div>
                        <div class="stat-value" style="color: var(--primary);">{{ stats.active_subscriptions }}</div>
                        <small style="color: var(--muted); font-size: 11px;">Kontrak langganan aktif</small>
                    </div>
                    <div class="card">
                        <div class="stat-title">Active Licenses</div>
                        <div class="stat-value" style="color: var(--success);">{{ stats.active_licenses }}</div>
                        <small style="color: var(--muted); font-size: 11px;">Tenant sedang operasional</small>
                    </div>
                    <div class="card">
                        <div class="stat-title">Total Revenue</div>
                        <div class="stat-value" style="font-size: 20px; color: #38bdf8;">{{ formatRupiah(stats.total_revenue) }}</div>
                        <small style="color: var(--muted); font-size: 11px;">Akumulasi nilai kontrak aktif</small>
                    </div>
                </div>

                <!-- ANALYTICS TAB SWITCHER -->
                <div style="display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">
                    <button class="btn btn-sm" :class="{ 'btn-primary': analyticsTab === 'executive' }" @click="setAnalyticsTab('executive')">
                        📊 Fase 1: Overview Eksekutif & Revenue
                    </button>
                    <button class="btn btn-sm" :class="{ 'btn-primary': analyticsTab === 'deep_dive' }" @click="setAnalyticsTab('deep_dive')">
                        🔬 Fase 2: Analisis Bisnis Lanjutan & Health Ops
                    </button>
                </div>

                <!-- TAB 1: FASE 1 CHARTS -->
                <div v-show="analyticsTab === 'executive'">
                    <!-- ROW 1: DECISION CORE CHARTS -->
                    <div class="chart-grid">
                        <!-- Chart 1: Expiration Radar -->
                        <div class="chart-card">
                            <div class="chart-header">
                                <div>
                                    <div class="chart-title">⏳ Radar Jatuh Tempo Lisensi (Early Warning)</div>
                                    <div class="chart-desc">Distribusi sisa masa aktif lisensi untuk antisipasi churn rate.</div>
                                </div>
                                <span v-if="analytics.expiring_radar" class="badge-pill badge-warning">
                                    {{ (analytics.expiring_radar.critical_7d || 0) + (analytics.expiring_radar.warning_30d || 0) }} Perlu Perhatian
                                </span>
                            </div>
                            <div class="chart-container">
                                <canvas id="chartExpiringRadar"></canvas>
                            </div>
                        </div>

                        <!-- Chart 2: Revenue Contribution per Application -->
                        <div class="chart-card">
                            <div class="chart-header">
                                <div>
                                    <div class="chart-title">💰 Kontribusi Revenue per Aplikasi</div>
                                    <div class="chart-desc">Sebaran omset berulang untuk alokasi resource & pengembangan produk.</div>
                                </div>
                                <span class="badge-pill badge-safe">Multi-Product</span>
                            </div>
                            <div class="chart-container">
                                <canvas id="chartRevenueApp"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- ROW 2: GROWTH & PRODUCT INTELLIGENCE CHARTS -->
                    <div class="chart-grid">
                        <!-- Chart 3: Monthly Revenue Trend -->
                        <div class="chart-card">
                            <div class="chart-header">
                                <div>
                                    <div class="chart-title">📈 Tren Pertumbuhan Pendapatan (MRR / Recurring)</div>
                                    <div class="chart-desc">Laju omset dari pelanggan baru & perpanjangan dari waktu ke waktu.</div>
                                </div>
                                <span class="badge-pill badge-safe">Growth Trajectory</span>
                            </div>
                            <div class="chart-container">
                                <canvas id="chartMonthlyTrend"></canvas>
                            </div>
                        </div>

                        <!-- Chart 4: Module Adoption Popularity -->
                        <div class="chart-card">
                            <div class="chart-header">
                                <div>
                                    <div class="chart-title">🧩 Tingkat Adopsi Modul Fitur (Popularitas)</div>
                                    <div class="chart-desc">Fitur paling banyak diambil customer untuk evaluasi bundling paket.</div>
                                </div>
                                <span class="badge-pill badge-safe">Fitur Terlaris</span>
                            </div>
                            <div class="chart-container">
                                <canvas id="chartModulePopularity"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: FASE 2 CHARTS (BUSINESS DEEP DIVE & HEALTH OPS) -->
                <div v-show="analyticsTab === 'deep_dive'">
                    <!-- ROW 1 FASE 2: CONTRACT MODEL & USER CAPACITY -->
                    <div class="chart-grid">
                        <!-- Chart 5: Billing Cycle Distribution -->
                        <div class="chart-card">
                            <div class="chart-header">
                                <div>
                                    <div class="chart-title">🔄 Distribusi Model Pembayaran (Billing Cycle)</div>
                                    <div class="chart-desc">Perbandingan langganan bulanan vs tahunan untuk stabilitas cash flow.</div>
                                </div>
                                <span class="badge-pill badge-safe">Cash Flow Stability</span>
                            </div>
                            <div class="chart-container">
                                <canvas id="chartBillingCycles"></canvas>
                            </div>
                        </div>

                        <!-- Chart 6: Max Users Tiering -->
                        <div class="chart-card">
                            <div class="chart-header">
                                <div>
                                    <div class="chart-title">👥 Skala Kuota Pengguna (Max Users Capacity)</div>
                                    <div class="chart-desc">Distribusi kapasitas seat user tenant (Starter, Medium, Enterprise).</div>
                                </div>
                                <span class="badge-pill badge-warning">Tiering Strategy</span>
                            </div>
                            <div class="chart-container">
                                <canvas id="chartUserTiers"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- ROW 2 FASE 2: API SECURITY & INSTANCE HEALTH -->
                    <div class="chart-grid">
                        <!-- Chart 7: API Validation Health -->
                        <div class="chart-card">
                            <div class="chart-header">
                                <div>
                                    <div class="chart-title">🛡️ Rasio Keberhasilan & Keamanan API Lisensi</div>
                                    <div class="chart-desc">Tingkat otorisasi sukses vs indikasi request ilegal / lisensi expired.</div>
                                </div>
                                <span class="badge-pill badge-safe">SLA & Security</span>
                            </div>
                            <div class="chart-container">
                                <canvas id="chartApiHealth"></canvas>
                            </div>
                        </div>

                        <!-- Chart 8: Instance Activity -->
                        <div class="chart-card">
                            <div class="chart-header">
                                <div>
                                    <div class="chart-title">📡 Status Aktivitas Instance Tenant (Heartbeat)</div>
                                    <div class="chart-desc">Deteksi klien aktif (<24 jam) vs klien dorman yang berisiko churn (>7 hari).</div>
                                </div>
                                <span class="badge-pill badge-safe">Client Retention</span>
                            </div>
                            <div class="chart-container">
                                <canvas id="chartInstanceActivity"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ACTIONABLE ATTENTION TABLE: LISENSI PERLU FOLLOW UP SEGERA -->
                <div id="attentionSection" v-if="analytics.expiring_list && analytics.expiring_list.length > 0" class="card" style="border-left: 4px solid #f97316;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <div>
                            <h4 style="font-size: 15px; font-weight: 800; color: #9a3412;">🚨 Radar Aksi: Lisensi Jatuh Tempo ≤ 30 Hari & Expired</h4>
                            <p style="font-size: 12px; color: var(--muted); margin-top: 2px;">Daftar pelanggan yang membutuhkan kontak langsung dari tim sales / customer retention.</p>
                        </div>
                        <span class="badge-pill badge-critical">{{ analytics.expiring_list.length }} Klien Perlu Ditindaklanjuti</span>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Customer & Kontak</th>
                                    <th>Aplikasi & Paket</th>
                                    <th>License Key</th>
                                    <th>Sisa Waktu</th>
                                    <th>Nilai Kontrak</th>
                                    <th>Aksi Cepat</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="item in analytics.expiring_list" :key="'attn-' + item.id">
                                    <td>
                                        <strong>{{ item.customer_name }}</strong>
                                        <div style="font-size: 11px; color: var(--muted);">{{ item.customer_email }} &bull; {{ item.customer_phone || '-' }}</div>
                                    </td>
                                    <td>
                                        <div>{{ item.application_name }}</div>
                                        <small style="color: var(--muted);">{{ item.package_name }}</small>
                                    </td>
                                    <td><code style="font-weight: 700; color: var(--primary);">{{ item.license_key }}</code></td>
                                    <td>
                                        <span class="badge-pill" :class="getDaysLeftBadge(item.days_left, item.status).class">
                                            {{ getDaysLeftBadge(item.days_left, item.status).text }}
                                        </span>
                                    </td>
                                    <td><strong>{{ formatRupiah(item.total_price) }}</strong></td>
                                    <td>
                                        <div style="display: flex; gap: 6px;">
                                            <a v-if="item.customer_phone" :href="'https://wa.me/' + item.customer_phone.replace(/^0/, '62')" target="_blank" class="btn btn-sm btn-primary" style="text-decoration: none; padding: 4px 8px; font-size: 11px;">💬 Hubungi WA</a>
                                            <button class="btn btn-sm" @click="setActivePage('subscriptions')" style="padding: 4px 8px; font-size: 11px;">Perpanjang</button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- RECENT LICENSES TABLE -->
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <div>
                            <h4 style="font-size: 15px; font-weight: 700;">Recent Issued Licenses</h4>
                            <p style="font-size: 12px; color: var(--muted);">Lisensi terbaru yang diterbitkan melalui auto-register atau manual.</p>
                        </div>
                        <button class="btn btn-sm" @click="setActivePage('licenses')">Lihat Semua Licenses →</button>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>License Key</th>
                                    <th>Application</th>
                                    <th>Customer</th>
                                    <th>Max Users</th>
                                    <th>Expires At</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="lic in licenses" :key="lic.id">
                                    <td><strong style="font-family: monospace; color: var(--primary);">{{ lic.license_key }}</strong></td>
                                    <td>{{ lic.application_name }}</td>
                                    <td>{{ lic.customer_name }}</td>
                                    <td><strong>{{ lic.max_users }} Users</strong></td>
                                    <td>{{ formatDate(lic.expires_at) }}</td>
                                    <td><span class="status" :class="'status-' + lic.status">{{ lic.status }}</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- PAGE 2: APPLICATIONS & MODULES -->
            <div v-if="activePage === 'applications'">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div>
                        <h2 style="font-size: 22px; font-weight: 800;">Applications & Modules</h2>
                        <p style="color: var(--muted); font-size: 13px;">Kelola master aplikasi dan modul fitur masing-masing produk.</p>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn btn-primary" @click="openModal('app')">+ Tambah Application</button>
                        <button class="btn" @click="openModal('module')">+ Tambah Module</button>
                    </div>
                </div>

                <div class="layout-grid">
                    <div>
                        <h4 style="font-size: 13px; color: var(--muted); margin-bottom: 10px; font-weight: 700;">DAFTAR APLIKASI</h4>
                        <div v-for="app in applications" :key="app.id" class="app-item" :class="{ active: selectedAppId === app.id }" @click="selectApplication(app.id)">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <strong>{{ app.name }}</strong>
                                <span class="status status-active">{{ app.code }}</span>
                            </div>
                            <small style="color: var(--muted); display: block; margin-top: 4px;">{{ app.modules_count }} Modules | {{ app.packages_count }} Packages</small>
                            <small class="app-launch" :title="app.launch_url || 'Tanpa URL hosted: customer memasukkan license key saat instalasi'">
                                {{ app.launch_url ? '🌐 Hosted · ' + app.launch_url : '💾 On-premise (tanpa URL hosted)' }}
                            </small>
                        </div>
                    </div>
                    <div>
                        <div class="card">
                            <h4 style="font-size: 16px; font-weight: 700; margin-bottom: 15px;">Modul Fitur Aplikasi</h4>
                            <div class="table-responsive">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Code</th>
                                            <th>Name</th>
                                            <th>Type</th>
                                            <th>Description</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="mod in selectedAppModules" :key="mod.id">
                                            <td><code style="font-weight: 700;">{{ mod.code }}</code></td>
                                            <td>{{ mod.name }}</td>
                                            <td>
                                                <span class="status" :class="mod.module_type === 'standard' ? 'status-active' : 'status-pending'">
                                                    {{ mod.module_type }}
                                                </span>
                                            </td>
                                            <td>{{ mod.description || '-' }}</td>
                                            <td>
                                                <button class="btn btn-sm btn-danger" @click="deleteModule(mod.id)">Hapus</button>
                                            </td>
                                        </tr>
                                        <tr v-if="selectedAppModules.length === 0">
                                            <td colspan="5" style="text-align: center; color: var(--muted); padding: 20px;">Belum ada modul untuk aplikasi ini.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PAGE 3: PACKAGES -->
            <div v-if="activePage === 'packages'">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div>
                        <h2 style="font-size: 22px; font-weight: 800;">Sales Packages</h2>
                        <p style="color: var(--muted); font-size: 13px;">Kelola paket komersial (Basic, Professional, Enterprise).</p>
                    </div>
                    <button class="btn btn-primary" @click="openModal('package')">+ Buat Paket Baru</button>
                </div>

                <div class="card">
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Application</th>
                                    <th>Package Name</th>
                                    <th>Code</th>
                                    <th>Base Price</th>
                                    <th>Max Users</th>
                                    <th>Max Instalasi</th>
                                    <th>Future Module Access</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="pkg in packages" :key="pkg.id">
                                    <td><strong>{{ pkg.application_name }}</strong></td>
                                    <td>{{ pkg.name }}</td>
                                    <td><code>{{ pkg.code }}</code></td>
                                    <td><strong>{{ formatRupiah(pkg.base_price) }}</strong> / {{ pkg.billing_cycle }}</td>
                                    <td>{{ pkg.max_users }} Users</td>
                                    <td>{{ pkg.max_instances }} lokasi</td>
                                    <td>
                                        <span class="status" :class="pkg.future_module_access ? 'status-active' : 'status-draft'">
                                            {{ Number(pkg.future_module_access) ? 'YA (modul baru otomatis)' : 'TIDAK' }}
                                        </span>
                                    </td>
                                    <td><span class="status status-active">{{ pkg.status }}</span></td>
                                </tr>

                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
                        <div style="background: #fef2f2; padding: 12px; border-radius: 8px; border: 1px solid #fecaca;">

                        <div style="background: #fef2f2; padding: 12px; border-radius: 8px; border: 1px solid #fecaca;">

                        <div style="background: #fef2f2; padding: 12px; border-radius: 8px; border: 1px solid #fecaca;">

                        </div>
                        <div style="background: #fef2f2; padding: 12px; border-radius: 8px; border: 1px solid #fecaca;">
                            <div style="font-weight: 700; color: #991b1b; font-size: 12px; margin-bottom: 4px;">🚨 5. Audit Log & Anomaly Alert</div>

                        </div>
                        <div style="background: #fef2f2; padding: 12px; border-radius: 8px; border: 1px solid #fecaca;">

                        <ol class="eco-flow">

                            <li><div><span class="eco-tag eco-t-app">Client</span><p>Terima <code>license_key</code>, <code>activation_key</code>, <code>max_users</code>, dan <code>modules</code>. Simpan di <code>.env</code> atau database lokal.</p>

                        <p class="eco-p">Alur self-service untuk aplikasi yang di-host oleh provider. Bedanya dengan Alur A: subscription dibuat berstatus <em>pending</em> dulu dan baru aktif setelah admin menyetujui pembayaran.</p>
                        <ol class="eco-flow">
                            <li><div><span class="eco-tag eco-t-shop">Showcase → LMD</span><p>Kartu paket dimuat dari <code>GET /api/packages?app_code=APOTEK</code>: nama, harga, kuota user, dan modul sama persis dengan data LMD.</p></div></li>
                            <li><div><span class="eco-tag eco-t-shop">Showcase</span><p>Isi nama, email, WhatsApp, nama toko, subdomain (contoh <code>tokoberkah.pos.local</code>), dan password admin.</p></div></li>
                            <li><div><span class="eco-tag eco-t-shop">Showcase</span><p>Tampil tagihan + PPN 11%, QRIS atau transfer. Customer klik “Saya Sudah Bayar”.</p></div></li>
                            <li><div><span class="eco-tag eco-t-shop">Showcase → LMD</span><p><code>POST /api/licenses/order</code> membuat customer, subscription <em>pending</em>, lisensi (ditahan), dan instance <code>{subdomain}.pos.local</code>. Mengembalikan <code>subscription_no</code>.</p></div></li>
                            <li><div><span class="eco-tag eco-t-shop">Showcase</span><p>Browser polling tiap 2,5 detik ke <code>GET /api/licenses/order_status?subscription_no=…</code>.</p></div></li>
                            <li><div><span class="eco-tag eco-t-lmd">Admin LMD</span><p>Banner muncul di Dashboard. Di <strong>Subscriptions → Persetujuan Pembayaran</strong>, admin cek uang masuk lalu klik <strong>Approve</strong> (atau Tolak). Lisensi aktif, masa berlaku dihitung sejak tanggal approve. Endpoint <code>approve_order</code> yang sama siap dipanggil n8n.</p></div></li>

                        <p class="eco-p">Mini POS memvalidasi lisensi dari server ke API LMD, menyimpan salinannya di database <code>mini_pos</code>, lalu mengurus login dan user sendiri. LMD memberi kuota <code>max_users</code> dan daftar <code>modules</code>: menu Kasir, Laporan, Stok hanya terbuka bila modulnya ada di paket (T-28).</p>

                            <li><div><span class="eco-tag eco-t-app">Mini POS</span><p>Tenant dan license key disimpan di database <code>mini_pos</code>. License key dihapus dari alamat browser.</p></div></li>
                            <li><div><span class="eco-tag eco-t-app">Mini POS</span><p>Layar <strong>Buat Akun Admin</strong> muncul sekali. Email harus sama dengan email pemesan di LMD sebagai bukti kepemilikan.</p></div></li>
                            <li><div><span class="eco-tag eco-t-app">Mini POS</span><p>Admin menambah kasir di <strong>Kelola User</strong>. Jumlah user aktif dibatasi <code>max_users</code> dari lisensi.</p></div></li>
                            <li><div><span class="eco-tag eco-t-app">Kasir</span><p>Perangkat lain cukup membuka <code>/mini-pos/?tenant=…</code> lalu login, tanpa license key. Lisensi dicek ulang ke LMD tiap 5 menit per sesi; jika LMD tidak terjangkau, aplikasi tetap jalan maksimal 24 jam.</p></div></li>
                        </ol>
                        <div class="eco-two">

                            </div>
                            <div class="eco-box">
                                <span class="eco-tag eco-t-app">Kuota turun (downgrade)</span>
                                <p>Jika user aktif melebihi kuota baru, hanya admin yang bisa masuk sampai jumlah user aktif dirapikan.</p>
                            </div>
                        </div>
                        <div class="eco-sublabel">Urutan pemeriksaan di <code>validate</code></div>
                        <div class="eco-checks">
                            <div class="eco-check"><span>License key ada di database?</span><span class="eco-r eco-no">tidak → 403, dicatat gagal</span></div>
                            <div class="eco-check"><span>Status lisensi = active?</span><span class="eco-r eco-no">tidak → 403 “status is suspended”</span></div>
                            <div class="eco-check"><span>Belum lewat <code>expires_at</code>?</span><span class="eco-r eco-no">lewat → status jadi expired, 403</span></div>
                            <div class="eco-check"><span>Instance diblokir admin / milik lisensi lain?</span><span class="eco-r eco-no">403 instance_blocked / instance_key_conflict</span></div>
                            <div class="eco-check"><span>Domain sama dengan domain terkunci?</span><span class="eco-r eco-no">beda → 403 domain_mismatch</span></div>
                            <div class="eco-check"><span>Instance baru: kuota instalasi masih ada?</span><span class="eco-r eco-no">penuh → 403 instance_limit_reached</span></div>
                            <div class="eco-check"><span>Hasil</span><span class="eco-r eco-yes">200 · valid, modules, max_users, expires_at · dicatat sukses</span></div>

                        <div class="eco-callout">

                        </div>

                        <div class="form-group full">
                            <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" v-model="packageForm.future_module_access">
                                <span><strong>Future Module Access:</strong> Paket ini otomatis mendapat modul baru di masa depan tanpa bayar lagi.</span>
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer" style="margin-top: 20px;">
                        <button type="button" class="btn" @click="closeModal">Batal</button>
                        <button type="submit" class="btn btn-primary">Simpan Paket</button>
                    </div>
                </form>

                <!-- Customer Form -->
                <form v-if="modalType === 'customer'" @submit.prevent="submitCustomer">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Customer Name</label>
                            <input v-model="customerForm.name" class="form-control" placeholder="PT Sehat Sentosa" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" v-model="customerForm.email" class="form-control" placeholder="admin@sehatsentosa.com" required>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input v-model="customerForm.phone" class="form-control" placeholder="081299887766">
                        </div>
                    </div>
                    <div class="modal-footer" style="margin-top: 20px;">
                        <button type="button" class="btn" @click="closeModal">Batal</button>
                        <button type="submit" class="btn btn-primary">Simpan Customer</button>
                    </div>
                </form>

                <!-- Subscription Form -->
                <form v-if="modalType === 'subscription'" @submit.prevent="submitSubscription">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label>Customer</label>
                            <select v-model="subForm.customer_id" class="form-control" required>
                                <option v-for="c in customers" :key="c.id" :value="c.id">{{ c.name }} ({{ c.code }})</option>
                            </select>
                        </div>
                        <div class="form-group full">
                            <label>Sales Package</label>
                            <select v-model="subForm.package_id" class="form-control" required>
                                <option v-for="p in packages" :key="p.id" :value="p.id">{{ p.application_name }} - {{ p.name }} ({{ formatRupiah(p.base_price) }})</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Start Date</label>
                            <input type="date" v-model="subForm.start_date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>End Date</label>
                            <input type="date" v-model="subForm.end_date" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer" style="margin-top: 20px;">
                        <button type="button" class="btn" @click="closeModal">Batal</button>
                        <button type="submit" class="btn btn-primary">Buat Subscription & Generate License</button>
                    </div>
                </form>

                <!-- License Validation API Tester Modal -->
                <div v-if="modalType === 'tester'">
                    <p style="font-size: 13px; color: var(--muted); margin-bottom: 15px;">
                        Simulasikan pemanggilan API <code>POST /api/licenses/validate</code> yang dilakukan oleh aplikasi client (Apotek, TMS, dll).
                    </p>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label>License Key</label>
                        <input v-model="tester.license_key" class="form-control" placeholder="LIC-APO-..." required>
                    </div>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label>Instance Key</label>
                        <input v-model="tester.instance_key" class="form-control" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label>Domain</label>
                        <input v-model="tester.domain" class="form-control">
                    </div>

                    <button class="btn btn-primary" style="width: 100%;" @click="testLicenseValidation" :disabled="tester.loading">
                        {{ tester.loading ? 'Validating...' : '🚀 Execute API Validation Request' }}
                    </button>

                    <div v-if="tester.result" style="margin-top: 20px;">
                        <label style="font-size: 12px; font-weight: 700; display: block; margin-bottom: 6px;">JSON API Response:</label>
                        <pre class="code-box">{{ JSON.stringify(tester.result, null, 2) }}</pre>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </template>
</div>

<script src="./assets/js/app.js?v=20261031_v3"></script>
</body>
</html>
